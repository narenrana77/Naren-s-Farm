name: Build Android APK (Naren's Farm)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build production web bundle (dist/)
        run: npm run build

      - name: Install Capacitor 7 Android toolchain
        run: npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project & sync web assets
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Apply Naren's Farm 3D App Icon & Android permissions
        run: |
          if [ -f "public/pwa-3d-512.png" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                [ -f "$dir/ic_launcher.png" ] && cp public/pwa-3d-512.png "$dir/ic_launcher.png" || true
                [ -f "$dir/ic_launcher_round.png" ] && cp public/pwa-3d-512.png "$dir/ic_launcher_round.png" || true
                [ -f "$dir/ic_launcher_foreground.png" ] && cp public/pwa-3d-512.png "$dir/ic_launcher_foreground.png" || true
              fi
            done
          fi
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.RECORD_AUDIO"
            ];
            for (const perm of perms) {
              if (!xml.includes(perm)) {
                xml = xml.replace("</manifest>", `    <uses-permission android:name="${perm}" />\n</manifest>`);
              }
            }
            fs.writeFileSync(p, xml);
          '

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare NarensFarm.apk artifact
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/NarensFarm.apk
          ls -lh apk-output/NarensFarm.apk

      - name: Upload NarensFarm.apk for 1-Click Download
        uses: actions/upload-artifact@v4
        with:
          name: NarensFarm-Android-APK
          path: apk-output/NarensFarm.apk
          retention-days: 30
